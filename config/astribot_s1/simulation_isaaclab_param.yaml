    simulator_type: "IsaacLab"
    # Isaac Lab 2.1.1 / Isaac Sim 4.5: synchronize GPU poses via Fabric.
    physics_device: "cuda:0"
    use_fabric: True
    robot_name: astribot_s1_whole_body
    model_path: "/astribot_descriptions/usd/astribot_s1_usd/astribot_s1_textured.usda"
    robot_list: [
        "astribot_torso",
        "astribot_head",
        "astribot_arm_left",
        "astribot_gripper_left",
        "astribot_arm_right",
        "astribot_gripper_right",
    ]
    joint_names_list: [
        ["astribot_torso_joint_1",

         "astribot_torso_joint_2",
         "astribot_torso_joint_3",
         "astribot_torso_joint_4"],

        ["astribot_head_joint_1",
         "astribot_head_joint_2"],

        ["astribot_arm_left_joint_1",
         "astribot_arm_left_joint_2",
         "astribot_arm_left_joint_3",
         "astribot_arm_left_joint_4",
         "astribot_arm_left_joint_5",
         "astribot_arm_left_joint_6",
         "astribot_arm_left_joint_7",],
        ['astribot_gripper_left_joint_L1'],
        ["astribot_arm_right_joint_1",
         "astribot_arm_right_joint_2",
         "astribot_arm_right_joint_3",
         "astribot_arm_right_joint_4",
         "astribot_arm_right_joint_5",
         "astribot_arm_right_joint_6",
         "astribot_arm_right_joint_7",],
        ['astribot_gripper_right_joint_L1'],
    ]
    gravity_compensation: True
    # Torso pitch: fitted against three 100 Hz replay feedback streams.
    # Independent torso gravity feedforward and gripper transient response.
    torso_joint_1_control:
        stiffness: 3200.0
        damping: 320.0
        effort_limit: 400.0
        gravity_compensation_scale: 1.1
    torso_joint_2_control:
        stiffness: 3200.0
        damping: 160.0
        effort_limit: 400.0
        gravity_compensation_scale: 1.0
    torso_joint_3_control:
        stiffness: 3200.0
        damping: 160.0
        effort_limit: 400.0
        gravity_compensation_scale: 1.0
    # Radians/s for all six signed joints of each gripper. The legacy
    # velocity_limit field is ignored by Isaac Lab 2.1 implicit actuators.
    gripper_left_control:
        stiffness: 800.0
        damping: 8.0
        effort_limit: 400.0
        velocity_limit_sim: 16.0
    gripper_right_control:
        stiffness: 800.0
        damping: 8.0
        effort_limit: 400.0
        velocity_limit_sim: 16.0
    # Show the Isaac Sim window while also publishing the configured cameras.
    # Use "rgb_array" for headless capture.
    mode: "human"
    width: 640
    height: 480
    object_names: []
    camera_names: ["head_rgbd", "left_wrist_rgbd", "right_wrist_rgbd"]
    # Per-camera RGB output sizes; width/height above configure the main window
    # and serve as defaults for cameras without an entry here.
    # Intrinsics and T_link<-cameraGL are authored in astribot_s1.usda.
    camera_resolutions:
        head_rgbd: {width: 1280, height: 720}       # cam_high
        left_wrist_rgbd: {width: 640, height: 360} # cam_left_wrist
        right_wrist_rgbd: {width: 640, height: 360} # cam_right_wrist
    sensor_names: []
    # The SDK derives gripper velocity from direct position frames. Applying
    # the legacy 100 ms position lookahead again causes transition overshoot.
    # Order: torso, head, left arm, left gripper, right arm, right gripper.
    vel_compensation_list: [True, True, True, False, True, False]
    update_trajectory_map: {}
